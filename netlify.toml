[build]
  publish = "web_app"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "data.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[functions.nexus_scheduler]
  schedule = "0 13 * * 1-5"

[[redirects]]
  from = "/api/health/ai"
  to = "/.netlify/functions/health_ai"
  status = 200

[[redirects]]
  from = "/api/health/scheduler"
  to = "/.netlify/functions/health_scheduler"
  status = 200

[[redirects]]
  from = "/api/daily_report"
  to = "/.netlify/functions/daily_report"
  status = 200

[[redirects]]
  from = "/api/live_ticker"
  to = "/.netlify/functions/live_ticker"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
