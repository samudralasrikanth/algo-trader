name: 🔍 Daily Post-Market Close Audit (15:45 IST)

on:
  schedule:
    # 10:15 UTC = 15:45 IST (Monday to Friday)
    - cron: '15 10 * * 1-5'
  workflow_dispatch:

jobs:
  run-postmarket-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas requests beautifulsoup4 lxml python-dotenv

      - name: Run Post-Market Audit Cycle (Syncs to Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 run_postmarket_audit.py
          python3 generate_web_data.py

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID || 'f5474525-5305-4487-b0d8-e5b66d0566cb' }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ]; then
            npx -y netlify-cli deploy --dir=web_app --site "$NETLIFY_SITE_ID" --prod --no-build || true
          fi
