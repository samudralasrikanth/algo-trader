name: 🌙 Daily Pre-Market Night Forecast (20:30 IST)

on:
  schedule:
    # 15:00 UTC = 20:30 IST (Monday to Friday)
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

jobs:
  run-premarket-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas requests beautifulsoup4 lxml python-dotenv

      - name: Run Night Forecast Cycle (Syncs to Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 run_night_forecast.py
          python3 generate_web_data.py

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID || 'f5474525-5305-4487-b0d8-e5b66d0566cb' }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ]; then
            npx -y netlify-cli deploy --dir=web_app --site "$NETLIFY_SITE_ID" --prod --no-build || true
          fi
